name: Container CI

on:
  pull_request:
    paths:
      - "hpo_link/**"
      - "server.py"
      - "mcp_server.py"
      - "docker/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - "container-release.json"
      - ".dockerignore"
      - ".env.docker.example"
      - "CHANGELOG.md"
      - ".github/workflows/container-ci.yml"
      - ".github/workflows/container-release.yml"
  push:
    branches:
      - main
    paths:
      - "hpo_link/**"
      - "server.py"
      - "mcp_server.py"
      - "docker/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - "container-release.json"
      - ".dockerignore"
      - ".env.docker.example"
      - "CHANGELOG.md"
      - ".github/workflows/container-ci.yml"
      - ".github/workflows/container-release.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  container-ci:
    permissions:
      contents: read
    uses: berntpopp/genefoundry-router/.github/workflows/_container-ci.yml@e8931f0114bba3568517d1c7b1f990bea2be31af # genefoundry-router v0.10.5
