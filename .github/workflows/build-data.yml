name: build-data
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Least privilege at the top level; the publish job opts up to contents: write.
env:
  UV_PYTHON: "3.14"
permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y zstd
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.8.7"
      - run: uv sync --frozen
      # resolve_latest_version validates the upstream tag against a strict ISO-date
      # grammar and raises on anything else. Assign first (a non-zero exit from the
      # resolver now aborts the step under set -euo pipefail, instead of being
      # swallowed by a wrapping echo), then re-validate the grammar in shell before
      # writing to GITHUB_OUTPUT, so an empty/invalid value can never be published
      # as db-v / hpo-.sqlite.zst (defense in depth with the Python validator and
      # the env: passing below).
      - id: ver
        run: |
          set -euo pipefail
          DATE="$(uv run python -c 'import httpx; from hpo_link.ingest.downloader import resolve_latest_version; print(resolve_latest_version(httpx.Client()))')"
          [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "invalid DATE resolved from upstream tag"; exit 1; }
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
      - name: Skip if already published
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pass the resolved tag through env, never interpolate it into the script body.
          DATE: ${{ steps.ver.outputs.date }}
        run: |
          set -euo pipefail
          if ! gh release view "db-v${DATE}" >/dev/null 2>&1; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          release_dir="$(mktemp -d)"
          trap 'rm -rf "$release_dir"' EXIT
          assets="$(gh release view "db-v${DATE}" --json assets --jq '[.assets[].name] | sort | join(",")')"
          # db-v2026-06-23 predates the standard SHA256SUMS/attestation
          # contract; it no-ops only after byte-level verification of every
          # audited invariant.
          if [[ "$DATE" == "2026-06-23" ]]; then
            [[ "$assets" == "hpo-2026-06-23.sqlite.zst,hpo-2026-06-23.sqlite.zst.sha256,manifest.json" ]] || {
              echo "legacy release identity mismatch" >&2
              exit 1
            }
            gh release download "db-v${DATE}" --dir "$release_dir" \
              --pattern 'hpo-2026-06-23.sqlite.zst' \
              --pattern 'hpo-2026-06-23.sqlite.zst.sha256' \
              --pattern manifest.json
            RELEASE_DIR="$release_dir" uv run python -c \
              'import os; from pathlib import Path; from hpo_link.ingest.release_identity import verify_legacy_release; print(verify_legacy_release(Path(os.environ["RELEASE_DIR"])))' \
              | grep -qx 'legacy_verified_noop'
            echo "exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Upstream unchanged since the last publish: verify the standard
          # identity (exact assets, checksums, manifest, provenance) and no-op.
          bundle="hpo-${DATE}.sqlite.zst"
          [[ "$assets" == "SHA256SUMS,${bundle},${bundle}.sha256,manifest.json" ]] || {
            echo "release identity mismatch: unexpected assets" >&2
            exit 1
          }
          gh release download "db-v${DATE}" --dir "$release_dir"
          cd "$release_dir"
          sha256sum -c SHA256SUMS
          digest="$(awk '{print $1}' SHA256SUMS)"
          [[ "$(cat "${bundle}.sha256")" == "$digest" ]] || { echo "sha256 sidecar mismatch" >&2; exit 1; }
          [[ "$(jq -r '.sha256' manifest.json)" == "$digest" && "$(jq -r '.sqlite_zst' manifest.json)" == "$bundle" && "$(jq -r '.hpo_version' manifest.json)" == "$DATE" ]] || {
            echo "manifest identity mismatch" >&2
            exit 1
          }
          for asset in "$bundle" "${bundle}.sha256" SHA256SUMS manifest.json; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" >/dev/null
          done
          echo "exists=true" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.exists == 'false'
        run: uv run hpo-link-data build
      - if: steps.check.outputs.exists == 'false'
        name: package
        env:
          DATE: ${{ steps.ver.outputs.date }}
        run: |
          zstd -19 -f data/hpo.sqlite -o "hpo-${DATE}.sqlite.zst"
          sha256sum "hpo-${DATE}.sqlite.zst" > SHA256SUMS
          awk '{print $1}' SHA256SUMS > "hpo-${DATE}.sqlite.zst.sha256"
          uv run python scripts/make_manifest.py "${DATE}"
      - if: steps.check.outputs.exists == 'false'
        name: attest release assets
        uses: actions/attest-build-provenance@00014ed6ed5efc5b1ab7f7f34a39eb55d41aa4f8 # v3.1.0
        with:
          subject-path: |
            hpo-*.sqlite.zst
            hpo-*.sqlite.zst.sha256
            SHA256SUMS
            manifest.json
      - if: steps.check.outputs.exists == 'false'
        name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATE: ${{ steps.ver.outputs.date }}
        run: |
          gh release create "db-v${DATE}" \
            hpo-*.sqlite.zst* SHA256SUMS manifest.json \
            --title "HPO DB ${DATE}" \
            --notes "Prebuilt hpo-link SQLite DB for HPO ${DATE}."
