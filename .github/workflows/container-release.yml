name: Container Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

jobs:
  validate-tag:
    name: Validate stable semantic version tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Reject non-stable or malformed tag refs
        shell: bash
        env:
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REF" =~ ^refs/tags/v(0|[1-9][0-9]{0,63})\.(0|[1-9][0-9]{0,63})\.(0|[1-9][0-9]{0,63})$ ]] || {
            echo "unsupported release tag ref: $EVENT_REF" >&2
            exit 1
          }
  container-release:
    needs: validate-tag
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    uses: berntpopp/genefoundry-router/.github/workflows/_container-release.yml@88b565f1b6047f47fd58138cbf041994bb137c03 # genefoundry-router v0.10.4
